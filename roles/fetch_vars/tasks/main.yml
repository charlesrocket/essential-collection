---

- name: Add remote variables
  when: fetch_vars_url is not regex("^\/")
  check_mode: false
  block:
    - name: Prepare temporary location
      ansible.builtin.tempfile:
        state: directory
      register: fetch_vars_temp_vars
      changed_when: false
      delegate_to: localhost

    - name: Fetch remote variables
      ansible.builtin.uri:
        url: "{{ fetch_vars_url }}"
        dest: "{{ fetch_vars_temp_vars.path + '/vars.yaml' }}"
      changed_when: false
      delegate_to: localhost

    - name: Include remote variables
      ansible.builtin.include_vars:
        file: "{{ fetch_vars_temp_vars.path + '/vars.yaml' }}"

- name: Add local variables
  ansible.builtin.include_vars:
    file: "{{ fetch_vars_url }}"
  when: fetch_vars_url is regex("^\/")
  check_mode: false
