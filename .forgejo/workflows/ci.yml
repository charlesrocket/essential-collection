---
name: CI
"on":
  pull_request:
  push:

jobs:
  lint:
    name: Lint
    if: forgejo.ref_type != 'tag'
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: pip3 install yamllint
      - run: yamllint .
      - run: ansible-galaxy collection build
      - run: >-
          ansible-galaxy collection install
          charlesrocket-essential-$(grep version galaxy.yml |
          awk '{print $2}').tar.gz

      - uses: https://github.com/ansible/ansible-lint@main

  ansible-test:
    name: Test
    runs-on: codeberg-small
    steps:
      - name: Perform sanity testing
        uses: https://github.com/ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: stable-2.17
          testing-type: sanity

      - name: Perform integration testing
        uses: https://github.com/ansible-community/ansible-test-gh-action@release/v1
        with:
          testing-type: integration

  docker:
    name: Molecule ${{ matrix.distro }}
    runs-on: codeberg-medium
    strategy:
      fail-fast: false
      matrix:
        distro:
          - alpine
          # - rocky

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v6

      - name: Set up Python3
        uses: https://github.com/actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: "**/requirements-dev.txt"
          check-latest: true

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Molecule
        run: molecule test -s linux
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.distro }}

  galaxy:
    name: Publish
    runs-on: codeberg-tiny
    needs: ansible-test
    if: ${{ forgejo.ref_type == 'tag' && forgejo.repository_owner == 'charlesrocket' }}
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Publish to Galaxy
        uses: https://github.com/ansible/ansible-publish-action@v1.0.0
        with:
          api_key: ${{ secrets.GALAXY_API_KEY }}
