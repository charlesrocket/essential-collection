---
name: CI
"on":
  pull_request:
  push:

jobs:
  lint:
    name: Lint
    if: forgejo.ref_type != 'tag'
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Format
        run: pipx run yamllint .
      - name: Lint
        uses: https://github.com/ansible/ansible-lint@main
